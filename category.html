<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Recipes - Smart Recipe Finder</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1 id="category-title">🍽️ Category Recipes</h1>
      <p id="category-description">All delicious recipes in this category</p>
    </header>

    <div class="results" id="category-results">
      <!-- Recipes will load here dynamically -->
    </div>

    <div class="back-link">
      <a href="index.html">← Back to all categories</a>
    </div>
  </div>

  <script>
    // Get the selected category from localStorage
    const category = localStorage.getItem('selectedCategory');
    
    // Update page title based on category
    const categoryTitles = {
      'vegetarian': '🥕 Vegetarian Recipes',
      'dessert': '🍰 Dessert Recipes',
      'quick': '⚡ Quick Meal Recipes'
    };
    
    document.getElementById('category-title').textContent = categoryTitles[category];
    document.getElementById('category-description').textContent = `All ${category} recipes`;

    // Recipe data (same as your main page)
    const recipes = [
      {
        name: "Paneer Butter Masala",
        ingredients: "paneer, tomato, cream, butter, spices",
        instructions: "Cook tomato gravy, add cream and spices...",
        category: "vegetarian",
        image: "https://myfoodstory.com/wp-content/uploads/2021/10/Paneer-Butter-Masala-1-2.jpg"
      },
      {
        name: "Veggie Stir Fry",
        ingredients: "broccoli, bell pepper, soy sauce, garlic",
        instructions: "Stir fry veggies, add sauce...",
        category: "vegetarian",
        image: "https://images.unsplash.com/photo-1626700051175-6818013e1d4f?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80"
      },
      {
        name: "Chocolate Mug Cake",
        ingredients: "flour, cocoa, sugar, milk, oil",
        instructions: "Mix ingredients in mug, microwave...",
        category: "dessert",
        image:  "https://tse1.mm.bing.net/th?id=OIP.53E68o16w4HrqXfL6Bz5PwHaLH&pid=Api&P=0&h=220"
       
      },
      {
        name: "Mango Smoothie",
        ingredients: "mango, milk, yogurt, honey",
        instructions: "Blend all ingredients...",
        category: "quick",
        image:"https://vaya.in/recipes/wp-content/uploads/2017/09/Mango-Smoothie_2-1.jpg"
      },
      {
        name: "Spaghetti Carbonara",
        ingredients: "spaghetti, eggs, pancetta, cheese",
        instructions: "Boil pasta, mix with eggs...",
        category: "quick",
        image: "https://images.unsplash.com/photo-1612874742237-6526221588e3?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80"
      }
    ];

    // Filter recipes by category
    const filteredRecipes = recipes.filter(recipe => recipe.category === category);
    const resultsContainer = document.getElementById('category-results');

    if (filteredRecipes.length === 0) {
      resultsContainer.innerHTML = `<p class="no-recipes">No recipes found in this category.</p>`;
    } else {
      filteredRecipes.forEach(recipe => {
        const recipeCard = document.createElement('div');
        recipeCard.className = 'recipe-card';
        recipeCard.innerHTML = `
          <div class="recipe-image">
            <img src="${recipe.image}" alt="${recipe.name}">
          </div>
          <div class="recipe-content">
            <h3>${recipe.name}</h3>
            <p><strong>Ingredients:</strong> ${recipe.ingredients}</p>
            <a href="recipe-detail.html?name=${encodeURIComponent(recipe.name)}" class="view-recipe">View Recipe</a>
          </div>
        `;
        resultsContainer.appendChild(recipeCard);
      });
    }
  </script>
</body>
</html>
