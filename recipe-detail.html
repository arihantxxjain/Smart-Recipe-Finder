<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Details - Smart Recipe Finder</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>🍳 Recipe Details</h1>
      <p>Get all the details to make this delicious dish!</p>
    </header>

    <div class="recipe-detail" id="recipeDetail">
      <!-- Recipe details will be loaded here -->
    </div>

    <div class="back-link">
      <a href="index.html">← Back to all recipes</a>
    </div>

    <footer>
      <p>© 2023 Smart Recipe Finder</p>
      <div class="footer-links">
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
        <a href="privacy.html">Privacy Policy</a>
      </div>
    </footer>
  </div>

  <script>
    // Get recipe name from URL
    const urlParams = new URLSearchParams(window.location.search);
    const recipeName = urlParams.get('name');
    
    // Find the recipe in our data
    const recipes = [
      {
        name: "Spaghetti Carbonara",
        ingredients: "spaghetti, eggs, pancetta, parmesan, pepper",
        instructions: "1. Boil pasta according to package instructions.\n2. Fry pancetta until crispy.\n3. Whisk eggs and grated cheese together.\n4. Drain pasta, reserving some cooking water.\n5. Quickly combine hot pasta with pancetta, then with egg mixture, adding pasta water as needed.\n6. Season with freshly ground black pepper and serve immediately.",
        category: "quick",
        image: "https://images.unsplash.com/photo-1612874742237-6526221588e3?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80",
        prepTime: "10 mins",
        cookTime: "15 mins",
        servings: 2
      },
      {
        name: "Paneer Butter Masala",
        ingredients: "paneer, tomato, cream, butter, spices (garam masala, turmeric, coriander, cumin)",
        instructions: "1. Blend tomatoes into a puree.\n2. Heat butter in a pan, add spices and tomato puree.\n3. Cook until oil separates from the mixture.\n4. Add cream and simmer for 5 minutes.\n5. Add cubed paneer and cook for another 5 minutes.\n6. Garnish with fresh cream and coriander leaves.",
        category: "vegetarian",
        image: "https://images.unsplash.com/photo-1633356122544-f134324a6cee?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80",
        prepTime: "15 mins",
        cookTime: "20 mins",
        servings: 4
      },
      {
        name: "Mango Smoothie",
        ingredients: "mango, milk, yogurt, honey",
        instructions: "1. Peel and chop the mango into cubes.\n2. Add mango, milk/yogurt, honey, and ice cubes to a blender.\n3. Blend until smooth and creamy.\n4. Add a pinch of cardamom powder for extra flavor (optional).\n5. Pour into glasses and serve immediately.\n6. Garnish with mango slices or mint leaves.",
        category: "quick",
        image: "https://vaya.in/recipes/wp-content/uploads/2017/09/Mango-Smoothie_2-1.jpg",
        prepTime: "5 mins",
        cookTime: "0 mins",
        servings: 2
      }

      // Add other recipes similarly
    ];
    
    const recipe = recipes.find(r => r.name === recipeName);
    const recipeDetail = document.getElementById('recipeDetail');
    
    if (recipe) {
      recipeDetail.innerHTML = `
        <div class="recipe-header">
          <div class="recipe-image-large">
            <img src="${recipe.image}" alt="${recipe.name}">
          </div>
          <div class="recipe-meta">
            <h2>${recipe.name}</h2>
            <div class="meta-info">
              <p><strong>Prep Time:</strong> ${recipe.prepTime}</p>
              <p><strong>Cook Time:</strong> ${recipe.cookTime}</p>
              <p><strong>Servings:</strong> ${recipe.servings}</p>
              <p><strong>Category:</strong> ${recipe.category.charAt(0).toUpperCase() + recipe.category.slice(1)}</p>
            </div>
          </div>
        </div>
        
        <div class="recipe-content-detail">
          <div class="ingredients">
            <h3>Ingredients</h3>
            <ul>
              ${recipe.ingredients.split(', ').map(ing => `<li>${ing}</li>`).join('')}
            </ul>
          </div>
          
          <div class="instructions">
            <h3>Instructions</h3>
            <div>
              ${recipe.instructions.split('\n').map(step => `<p>${step}</p>`).join('')}
            </div>
          </div>
        </div>
      `;
    } else {
      recipeDetail.innerHTML = `<p>Recipe not found. <a href="index.html">Browse all recipes</a></p>`;
    }
  </script>
</body>
</html>
